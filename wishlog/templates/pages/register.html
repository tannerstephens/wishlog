{% extends "pages/_base.html" %}

{% block title %}Set up · WishLog{% endblock %}

{% block header %}
    <script src="/static/js/register.js"></script>
{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-two-thirds-tablet is-5-desktop">
                <span class="auth-brand title is-3">WishLog</span>

                {% include 'fragments/flash.html' %}

                <div class="box">
                    <h1 class="title is-4">Create your account</h1>
                    <p class="subtitle is-6 has-text-grey">This account owns the list. Visitors don't need one.</p>

                    <form name="register">
                        <div class="field">
                            <label class="label" for="username">Username</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                                <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label" for="password">Password</label>
                            <div class="control has-icons-left">
                                <input class="input" type="password" id="password" name="password" autocomplete="new-password" required>
                                <span class="icon is-small is-left"><i class="fas fa-lock"></i></span>
                            </div>
                        </div>

                        <div class="notification is-danger is-hidden" id="formError" role="alert"></div>

                        <div class="field">
                            <div class="control">
                                <button class="button is-primary is-fullwidth" type="submit">Create account</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
