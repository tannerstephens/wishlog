{% extends "pages/_base.html" %}

{% block title %}Log in · WishLog{% endblock %}

{% block header %}
    <script src="/static/js/login.js"></script>
{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-two-thirds-tablet is-5-desktop">
                <a class="auth-brand title is-3" href="/">WishLog</a>

                {% include 'fragments/flash.html' %}

                <div class="box">
                    <h1 class="title is-4">Log in</h1>
                    <p class="subtitle is-6 has-text-grey">Owner login, to add and edit items on the list.</p>

                    <form name="login">
                        <div class="field">
                            <label class="label" for="username">Username</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                                <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label" for="password">Password</label>
                            <div class="control has-icons-left">
                                <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
                                <span class="icon is-small is-left"><i class="fas fa-lock"></i></span>
                            </div>
                        </div>

                        <div class="notification is-danger is-hidden" id="formError" role="alert"></div>

                        <div class="field">
                            <div class="control">
                                <button class="button is-primary is-fullwidth" type="submit">Log in</button>
                            </div>
                        </div>
                    </form>
                </div>

                <p class="has-text-centered">
                    <a href="/">← Back to the list</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
