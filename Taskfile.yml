version: '3'

tasks:
  make-migrations:
    cmds:
      - pipenv run alembic revision --autogenerate
  migrate:
    cmds:
      - pipenv run alembic upgrade head
  dev:
    cmds:
      - pipenv run python dev.py
  seed:
    desc: Fill the database with sample data (pass -- --reset to wipe it first)
    cmds:
      - task: migrate
      - pipenv run python seed.py {{.CLI_ARGS}}
